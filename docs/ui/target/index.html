<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lianiq · Target UI design preview</title>
  <link rel="stylesheet" href="styles.css">
  <script src="preview.js" defer></script>
</head>
<body>
  <aside class="preview-bar" aria-label="Design preview controls">
    <span><strong>DESIGN PREVIEW</strong> · Synthetic data. No audio, downloads or installed-language claims.</span>
    <label>Scenario <select id="scenario">
      <option value="conversation">Conversation · listening</option>
      <option value="ready">Conversation · ready</option>
      <option value="speaking">Conversation · speaking</option>
      <option value="translating">Conversation · translating</option>
      <option value="loading">Conversation · loading</option>
      <option value="error">Conversation · device lost</option>
      <option value="text">Text translation · text result</option>
      <option value="text-speaking">Text translation · spoken result</option>
      <option value="speech-text">Speech to text · listening</option>
      <option value="speech-text-ready">Speech to text · ready</option>
      <option value="bridge">Call Bridge · setup</option>
      <option value="bridge-live">Call Bridge · active</option>
      <option value="bridge-error">Call Bridge · muted lane</option>
      <option value="languages">Language packs · capability gaps</option>
      <option value="setup">First-run setup</option>
    </select></label>
  </aside>
  <div class="app">
    <aside class="app-header" aria-label="Application sidebar">
      <a class="brand" href="#conversation" aria-label="Lianiq conversation"><span class="brand-mark">li</span>lianiq</a>
      <nav aria-label="Main navigation">
        <button data-view="conversation" title="Conversation" aria-label="Conversation"><span class="nav-icon" aria-hidden="true">↔</span><span class="nav-label">Conversation</span></button>
        <button data-view="text" title="Text translation" aria-label="Text translation"><span class="nav-icon" aria-hidden="true">T</span><span class="nav-label">Text translation</span></button>
        <button data-view="speech-text" title="Listen & translate" aria-label="Listen & translate"><span class="nav-icon" aria-hidden="true">≋</span><span class="nav-label">Listen &amp; translate</span></button>
        <button data-view="bridge" title="Call Bridge — experimental" aria-label="Call Bridge — experimental"><span class="nav-icon" aria-hidden="true">⇄</span><span class="nav-label">Call Bridge <span class="tiny">Experimental</span></span></button>
        <button data-view="languages" title="Language packs" aria-label="Language packs"><span class="nav-icon" aria-hidden="true">文</span><span class="nav-label">Language packs</span></button>
        <button data-view="setup" title="Settings" aria-label="Settings"><span class="nav-icon" aria-hidden="true">⚙</span><span class="nav-label">Settings</span></button>
      </nav>
      <span class="privacy"><span class="dot"></span>Offline session</span>
    </aside>
    <main id="content"></main>
    <footer class="app-footer"><span>Audio stays on this device · No automatic transcript saving</span><span>Desktop UI concept · English interface</span></footer>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
