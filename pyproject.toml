[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-german-mandarin-interpreter"
version = "0.1.0"
description = "Offline real-time German-Mandarin interpreter for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.27,<2",
  "numpy>=1.26,<3",
  "piper-tts>=1.2,<2",
  "PySide6==6.8.3",
  "sacremoses>=0.1,<1",
  "sentencepiece>=0.2,<1",
  "sounddevice>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.47,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
offline-interpreter = "offline_translator.app:main"

[tool.setuptools.packages.find]
include = ["offline_translator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
