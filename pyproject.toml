[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-german-mandarin-interpreter"
version = "0.1.0"
description = "Offline near-real-time German-Mandarin interpreter for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Boris Heuer" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["offline", "speech-translation", "german", "mandarin", "windows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.27,<3",
  "numpy>=1.26,<3",
  "piper-tts==1.8.0",
  "PySide6==6.11.2",
  "sacremoses>=0.1,<1",
  "sentencepiece>=0.2,<1",
  "sounddevice>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.47,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
build = ["pyinstaller>=6.11,<7", "wheel>=0.45,<1"]

[project.scripts]
offline-interpreter = "offline_translator.app:main"

[project.urls]
Homepage = "https://github.com/boris-heuer/offline-german-mandarin-interpreter"
Issues = "https://github.com/boris-heuer/offline-german-mandarin-interpreter/issues"
Documentation = "https://github.com/boris-heuer/offline-german-mandarin-interpreter#readme"

[tool.setuptools.packages.find]
include = ["offline_translator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
