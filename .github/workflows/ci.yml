name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Individual jobs request only any additional permission they actually need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # actions/checkout v4.2.2
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.6.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install project and development tools
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Build wheel
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .

      - name: Smoke-test the built package
        shell: pwsh
        run: |
          python -m venv .package-smoke
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          .\.package-smoke\Scripts\python -m pip install --no-deps $wheel.FullName
          .\.package-smoke\Scripts\python -c "import offline_translator; print(offline_translator.__version__)"
