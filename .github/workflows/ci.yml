name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install "numpy>=1.26,<3" "pytest>=8,<9" "ruff>=0.9,<1"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest
